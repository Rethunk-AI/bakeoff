name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-migrate:
    name: go (lint + vuln + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The sync tests create a throwaway database per test and apply schema/schema.sql themselves.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Rethunk-Tech/gh-actions/setup-go@ed6afe0e127f69c7da2c8178521fa0d049176a00 # v1.36
        with:
          go-version-file: migrate/go.mod
          run-lint: "true"
          run-govulncheck: "true"

      - name: Vet
        working-directory: migrate
        run: go vet ./...

      - name: Test
        working-directory: migrate
        run: |
          go test -race -v ./... | tee test.log
          if grep -q -- '--- SKIP' test.log; then
            echo "::error::a Go test was skipped; the Postgres service is not reaching the tests"
            exit 1
          fi

  python:
    name: python lint + type + dry-run (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Rethunk-Tech/gh-actions/setup-python@ed6afe0e127f69c7da2c8178521fa0d049176a00 # v1.36
        with:
          python-version: ${{ matrix.python-version }}
          install-args: --all-extras
          run-ruff: "true"
          ruff-paths: bench/ tests/
          run-audit: "true"

      - name: Pyrefly
        run: uv run pyrefly check bench/

      - name: Py compile
        run: uv run python -m compileall -q bench/ tests/

      - name: Pytest
        run: uv run pytest

      - name: Dry-run
        run: uv run python -m bench.runner --config config.yaml --dry-run

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck run.sh

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows
        run: scripts/actionlint -color

  # One required check for branch protection: a matrix leg that never ran must not look like success.
  all-checks:
    if: always()
    needs: [go-migrate, python, shell, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any check did not succeed
        run: |
          if [ "${{ needs.go-migrate.result }}" != "success" ] \
            || [ "${{ needs.python.result }}" != "success" ] \
            || [ "${{ needs.shell.result }}" != "success" ] \
            || [ "${{ needs.workflows.result }}" != "success" ]; then
            echo "go-migrate=${{ needs.go-migrate.result }} python=${{ needs.python.result }} shell=${{ needs.shell.result }} workflows=${{ needs.workflows.result }}"
            exit 1
          fi
          echo "all checks passed"
