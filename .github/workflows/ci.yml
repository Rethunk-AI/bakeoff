name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-migrate:
    name: go (lint + vuln + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Rethunk-Tech/gh-actions/setup-go@4163d2a5a37b1538dd45926e264b3c4027b5cbaa # v1.24
        with:
          go-version-file: migrate/go.mod
          run-lint: "true"
          run-govulncheck: "true"

      - name: Vet
        working-directory: migrate
        run: go vet ./...

      - name: Test
        working-directory: migrate
        run: go test -race ./...

  python:
    name: python lint + type + dry-run (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Rethunk-Tech/gh-actions/setup-python@4163d2a5a37b1538dd45926e264b3c4027b5cbaa # v1.24
        with:
          python-version: ${{ matrix.python-version }}
          install-args: --all-extras
          run-ruff: "true"
          ruff-paths: bench/ tests/

      - name: Pyrefly
        run: uv run pyrefly check bench/

      - name: Py compile
        run: uv run python -m compileall -q bench/ tests/

      - name: Pytest
        run: uv run pytest

      - name: Dry-run
        run: uv run python -m bench.runner --config config.yaml --dry-run

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck
        run: shellcheck run.sh

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          # Transient GitHub 502/504 and dropped connections should not fail the run.
          bash <(curl -fsSL --retry 18 --retry-delay 10 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color
