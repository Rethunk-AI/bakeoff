name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-migrate:
    name: go (lint + vuln + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Rethunk-Tech/gh-actions/setup-go@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          go-version-file: migrate/go.mod
          run-lint: "true"
          run-govulncheck: "true"

      - name: Vet
        working-directory: migrate
        run: go vet ./...

      - name: Test
        working-directory: migrate
        run: go test ./...

  python:
    name: python lint + type + dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.2.0

      - name: Install dev deps
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check bench/ tests/

      - name: Pyrefly
        run: uv run pyrefly check bench/

      - name: Py compile
        run: uv run python -m compileall -q bench/ tests/

      - name: Pytest
        run: uv run pytest

      - name: Dry-run
        run: uv run python -m bench.runner --config config.yaml --dry-run

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck
        run: shellcheck bin/llama-swap.sh run.sh

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color
