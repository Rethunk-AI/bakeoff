[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bakeoff"
version = "0.1.0"
description = "Local LLM N-vs-N benchmark harness (models served through engined, OpenAI-compat)."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=43.0",
  "httpx>=0.28.1",
  "huggingface_hub>=1.12.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
bakeoff-report = "bench.report_cli:main"
bakeoff-worker = "bench.worker:main"

# Auto-discovery trips over the gitignored `results/` and `datasets/` output
# directories when they exist on disk during `pip install -e .`. Pin the
# package set explicitly so local dev installs don't depend on those dirs
# being absent.
[tool.setuptools]
packages = ["bench"]

# --- Ruff ------------------------------------------------------------------
# Runner/reporter text contains user-facing Unicode (×, em dashes, etc.) by
# design; fixture prompts in dataset.py are long literal strings. Keep lint
# discipline but exempt those.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
# python-pyproject-00005: E501 is the formatter's job once line-length is set
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bench/dataset.py" = [
  "E501",
  "S311",
] # long fixture prompts; seeded RNG for synthetic tasks
"bench/engined.py" = ["S607"] # PATH lookup of engined and host tools
"bench/hardware.py" = [
  "S603",
] # nvidia-smi/rocm-smi/sysctl subprocess, fixed argv
"bench/metrics.py" = [
  "RUF002",
  "RUF003",
  "S603",
  "S607",
] # × in formulas; power samplers call host tools
"bench/provenance.py" = ["S603"] # git subprocess with fixed argv
"bench/publish.py" = ["S603", "S607"] # git/gh subprocess with fixed argv
"bench/report.py" = [
  "RUF001",
  "RUF002",
  "RUF003",
  "E501",
] # × in UI strings; long rows
"bench/runner.py" = ["RUF002", "S311"] # × in docstrings; seeded pairwise order
"bench/worker.py" = ["S603"] # git subprocess with fixed argv
"tests/**" = ["S101"] # pytest assertions
"tests/test_engined_route.py" = ["S311"] # seeded RNG in fixtures
"tests/test_metrics.py" = ["RUF003", "S311"] # × in formula comments; seeded RNG
"tests/test_runner.py" = [
  "S108",
] # "/tmp/models" is a mock path, not a created file
"tests/test_worker.py" = ["S105"] # "token" is a mock credential in fixtures

# --- Pyrefly ---------------------------------------------------------------
# CI only ever type-checked bench/, never tests/ -- keep that scope.
[tool.pyrefly]
project-includes = ["bench"]
check-unannotated-defs = true

[[tool.pyrefly.sub-config]]
matches = "bench/hardware.py"
[tool.pyrefly.sub-config.errors]
# psutil is an optional, lazily-imported dependency (see _ram_gb()'s
# try/except) -- not declared in [project.dependencies], not installed
# in the base dev environment.
missing-import = false

# --- Deptry ------------------------------------------------------------------
[tool.deptry]
known_first_party = ["bench"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
# Same lazy/optional psutil import as the pyrefly sub-config above: never a
# hard dependency, so deptry can't see it as declared.
DEP001 = ["psutil"]

# --- Pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
  "lefthook>=2.1.10",
  "deptry",
  "pyrefly>=0.1",
  "pytest>=9.0.3",
  "ruff>=0.17.5",
  "types-psutil>=7.0.0.20250601",
  "types-PyYAML>=6.0.12.20260518",
]
