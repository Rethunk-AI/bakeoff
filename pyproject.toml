[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bakeoff"
version = "0.1.0"
description = "Local LLM N-vs-N benchmark harness (llama.cpp podman + OpenAI-compat)."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=43.0",
  "httpx>=0.28.1",
  "huggingface_hub>=1.12.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "deptry>=0.25",
  "pyrefly>=0.1",
  "pytest>=9.0.3",
  "ruff>=0.15.13",
  "types-psutil>=7.0.0.20250601",
  "types-PyYAML>=6.0.12.20260518",
]

[project.scripts]
bakeoff-report = "bench.report_cli:main"

# Auto-discovery trips over the gitignored `results/` and `datasets/` output
# directories when they exist on disk during `pip install -e .`. Pin the
# package set explicitly so local dev installs don't depend on those dirs
# being absent.
[tool.setuptools]
packages = ["bench"]

# --- Ruff ------------------------------------------------------------------
# Runner/reporter text contains user-facing Unicode (×, em dashes, etc.) by
# design; fixture prompts in dataset.py are long literal strings. Keep lint
# discipline but exempt those.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bench/dataset.py" = ["E501"] # fixture prompts are intentionally long
"bench/metrics.py" = ["RUF002", "RUF003"] # × in formulas/docstrings by design
"bench/report.py" = [
  "RUF001",
  "RUF002",
  "RUF003",
  "E501",
] # × in UI strings; long rows
"bench/runner.py" = ["RUF002"] # × in docstrings by design
"tests/test_metrics.py" = ["RUF003"] # × in formula comments by design

# --- Pyrefly ---------------------------------------------------------------
# CI only ever type-checked bench/, never tests/ -- keep that scope.
[tool.pyrefly]
project-includes = ["bench"]

[[tool.pyrefly.sub-config]]
matches = "bench/hardware.py"
[tool.pyrefly.sub-config.errors]
# psutil is an optional, lazily-imported dependency (see _ram_gb()'s
# try/except) -- not declared in [project.dependencies], not installed
# in the base dev environment.
missing-import = false

# --- Deptry ------------------------------------------------------------------
[tool.deptry]
known_first_party = ["bench"]
# The "dev" extra is tooling (linters, type checker, test runner) invoked as
# CLIs, not imported by bench/ -- without this deptry reports every one of
# them as an unused dependency (DEP002).
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Same lazy/optional psutil import as the pyrefly sub-config above: never a
# hard dependency, so deptry can't see it as declared.
DEP001 = ["psutil"]

# --- Pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "lefthook>=2.1.10",
]
